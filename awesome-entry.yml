url: https://github.com/ifengz/dsh-compactui
name: ifengz/dsh-compactui
category: ui
description:
  en: "Codex-style compact sidebar for DSH: one top row holds the logo, an inline session search and the menu button; the plugin, market and automation entries fold into a popover where a + pins them back into the sidebar; pinned sessions get a collapsible section that survives collapsed projects. Includes a one-click Native / Compact layout switch, so you can go back to the stock sidebar without restarting the app. Client-side only, no dependencies."
  zh: "把 DSH 侧栏改成 Codex 风格紧凑布局：顶部一行放 Logo、内联会话搜索和菜单按钮；插件、市场、自动化入口收进浮层，点 + 就加回侧栏；置顶会话单独成块，项目折叠也不丢。带一键「原生/紧凑」切换，不用重启应用就能回原生布局。纯前端实现、零依赖。"
